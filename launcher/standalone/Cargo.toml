[package]
name = "launch-rust-edition"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
